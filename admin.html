<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d1c"><title>Admin — A2Z Song</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="./"><span class="brand-mark">♫</span><span>A2Z <b>Song</b></span></a><a class="admin-link" href="./">← Home page</a></header>
  <main class="admin-shell">
    <div class="eyebrow">A2Z SONG / CONTROL ROOM</div>
    <h1 class="admin-title">Admin <span>Panel</span></h1>
    <section class="panel" id="login-panel">
      <h2>Admin sign in</h2><p class="muted">Sign in with the admin account you create in Supabase.</p>
      <form id="login-form" class="admin-form">
        <label>Email<input id="email" type="email" placeholder="admin@example.com" required></label>
        <label>Password<input id="password" type="password" placeholder="Your password" required></label>
        <button class="primary-button" type="submit">Sign in</button>
      </form><p class="form-message" id="login-message"></p>
    </section>

    <section id="dashboard" hidden>
      <div class="dashboard-head"><div><h2>Manage songs</h2><p class="muted">Add Cloudflare R2 links. Songs appear on the public home page.</p></div><button id="logout" class="outline-button">Sign out</button></div>
      <div class="panel">
        <h3 id="form-heading">Add a new song</h3>
        <form id="song-form" class="admin-form">
          <input type="hidden" id="song-id">
          <div class="form-grid">
            <label>Song title *<input id="title" required placeholder="Song name"></label>
            <label>Artist / singer<input id="artist" placeholder="Singer name"></label>
            <label>Album / movie<input id="album" placeholder="Album or movie name"></label>
            <label>Year<input id="year" type="number" min="1900" max="2100" placeholder="2026"></label>
            <label class="wide">Cover image URL<input id="cover" type="url" placeholder="https://..."></label>
            <label class="wide">Cloudflare R2 MP3 URL *<input id="audio_url" type="url" required placeholder="https://your-public-r2-domain/song.mp3"></label>
          </div>
          <div class="form-buttons"><button class="primary-button" type="submit" id="save-song">Save song</button><button class="outline-button" type="button" id="cancel-edit" hidden>Cancel edit</button></div>
        </form><p class="form-message" id="song-message"></p>
      </div>
      <div class="panel"><div class="dashboard-head"><h3>Published songs</h3><span class="count" id="admin-count">0</span></div><div id="admin-song-list" class="admin-song-list"><p class="muted">Loading songs…</p></div></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body>
</html>
